# Best achieved raw null depth of nulling interferometers.
# Units: wavelength in µm. Null depth is a ratio without unit.
#
# Fields of a result:
#   label           Short reference, for example "Author+Year (Instrument)". Optional if plot_label is set.
#   plot_label      Text on the plot. \n makes a line break. Optional if label is set, default label.
#   first_author    Family name of the first author. Optional.
#   year            Year of publication or measurement. Optional.
#   instrument      Instrument or testbed name. Optional.
#   setting         on-sky or testbed.
#   status          published, in-preparation, or unpublished (internal lab milestone).
#   wavelength_um   [min, max] for a broadband measurement, [value] for a narrowband measurement.
#   null_depth      Best achieved raw null depth.
#   url             Link to the publication. Optional.
#   highlight       true to show the result as "This work". Optional.
#   label_position  right, left, top or bottom. Optional, default right.
#   display         false to remove the result from the plot and the table. Optional, default true.
#
# A lab milestone has no publication. Set status: unpublished and use plot_label for the date, for example "2026-10-06".

